<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Leaflet Test</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet/dist/leaflet.css"
    />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 10px 0;
        }

        #map {
            height: 90vh;
            width: 100%;
        }
    </style>
</head>

<body>

<h1>Minimal Leaflet Map (No Data)</h1>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
    // Create map
    const map = L.map('map').setView([51.5074, -0.1278], 5);

    // Add basemap
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // Add a marker
    L.marker([51.5074, -0.1278])
        .addTo(map)
        .bindPopup('London')
        .openPopup();

    L.marker([55.9533, -3.1883])
        .addTo(map)
        .bindPopup('Edinburgh');

    L.marker([53.4808, -2.2426])
        .addTo(map)
        .bindPopup('Manchester');
</script>

</body>
</html>
